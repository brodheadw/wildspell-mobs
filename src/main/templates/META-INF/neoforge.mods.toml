modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="wildspellmobs_logo.png"
credits="Built for YUNG's Cave Biomes' Frosted Caves."
authors="Will Brodhead"
description='''
Cold-cave monsters for YUNG's Frosted Caves. Rime Skulls float, gnash and spit ice; zombies that linger in the cold freeze into lurching Frozen Zombies, and ones caught on ice sink into it and throw snowballs. Also thins out creepers and other monsters underground.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    reason="The Ice Lich's and the Flytrap's models and animations"
    versionRange="[4.9,)"
    ordering="NONE"
    side="BOTH"
