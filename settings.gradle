pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.kikugie.dev/snapshots' }
        maven { url = 'https://maven.kikugie.dev/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.7.5'
}

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(rootProject) {
        // A new version needs a line here and a versions/<mc>-neoforge/gradle.properties.
        vers('1.21.1-neoforge', '1.21.1')
        vcsVersion = '1.21.1-neoforge'
    }
}
